# /etc/dl-loop/dl-loop.conf – settings for dl-loop.service
# After changes: systemctl restart dl-loop

URL_FILE=/etc/dl-loop/urls.txt

# Number of concurrent downloads (more streams = easier to saturate the line)
PARALLEL=4

# Optional per-stream limit (curl syntax: 500K, 20M ...). Empty = unlimited.
RATE_LIMIT=

# URL selection per round:
#   random     = random picks with replacement (default)
#   shuffle    = every URL once, in random order
#   sequential = file order
ORDER=random

# Downloads per round in 'random' mode. Empty = number of URLs in the file.
ROUND_SIZE=

# Pause between rounds in seconds
PAUSE=5

# If a whole round takes less than MIN_ROUND seconds, something is wrong
# (no network, dead URLs) -> wait BACKOFF seconds instead of hammering.
MIN_ROUND=30
BACKOFF=60
