# /etc/ul-loop/ul-loop.conf – settings for ul-loop.service
# After changes: systemctl restart ul-loop

URL_FILE=/etc/ul-loop/urls.txt

# Start size of one upload request. Random payload files are created in
# /var/lib/ul-loop (one per size in use).
# Servers answering HTTP 413 get a smaller payload automatically.
PAYLOAD_SIZE=20M

# On HTTP 413 the payload for that server is halved automatically,
# but never below this size.
MIN_PAYLOAD_SIZE=1M

# Concurrent uploads. With ~50 Mbit/s upload, 2–4 streams saturate easily.
PARALLEL=2

# URL selection per round:
#   random     = ROUND_SIZE random picks (with replacement)  – default
#   shuffle    = every URL once, random order
#   sequential = file order
ORDER=random
ROUND_SIZE=20

# Optional per-stream limit (curl syntax: 500K, 2M ...). Empty = unlimited.
RATE_LIMIT=

# Servers that fail (5xx, timeout ...) are skipped for COOLDOWN seconds
COOLDOWN=1800

# Pause between rounds in seconds
PAUSE=10

# Round shorter than MIN_ROUND seconds = something is wrong -> wait BACKOFF
MIN_ROUND=20
BACKOFF=60
